name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: cargo build --release --locked --no-default-features
      - run: cargo test --release --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
  # Retrieval gate on the public synthetic gold set (tests/gold/public.json,
  # regenerated by tests/gold/make_public.py): a ranking change that loses
  # answers or answers absent questions fails here. Keyword run first (no
  # model), then the model run; the model and runtime downloads are cached on
  # the pinned checksums in src/embed/download.rs.
  retrieval:
    runs-on: ubuntu-latest
    env:
      MEMORYCASTLE_HOME: ${{ github.workspace }}/../mc
      MEMORYCASTLE_NO_LEDGER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/../mc/models
            ${{ github.workspace }}/../mc/runtime
          key: mc-model-${{ runner.os }}-${{ hashFiles('src/embed/download.rs') }}
      - run: cargo build --release --locked --bin memcastle
      - name: Load the fixture
        run: |
          cp -r tests/gold/public ../tidepool
          cd ../tidepool && git init -q
          "$GITHUB_WORKSPACE/target/release/memcastle" save -q --keyword memorycastle/journal/*.md
      - name: Keyword gate
        working-directory: ../tidepool
        run: |
          "$GITHUB_WORKSPACE/target/release/memcastle" eval -q --keyword --gold "$GITHUB_WORKSPACE/tests/gold/public.json" --gate-recall 0.85 --gate-absent 1
      - name: Model gate
        working-directory: ../tidepool
        run: |
          "$GITHUB_WORKSPACE/target/release/memcastle" embed -q
          "$GITHUB_WORKSPACE/target/release/memcastle" eval -q --gold "$GITHUB_WORKSPACE/tests/gold/public.json" --gate-recall 0.90 --gate-absent 0
  # A store written by older releases must open with this build from eight
  # processes at once (a pre-release build broke exactly here). Upgrades from
  # the latest release.
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --no-default-features --bin memcastle
      - run: scripts/upgrade_check.sh target/release/memcastle
