name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: |
          cd target/${{ matrix.target }}/release
          tar czf memorycastle-${{ github.ref_name }}-${{ matrix.target }}.tar.gz memorycastle memcastle
          shasum -a 256 memorycastle-*.tar.gz > memorycastle-${{ github.ref_name }}-${{ matrix.target }}.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/${{ matrix.target }}/release/memorycastle-*.tar.gz
            target/${{ matrix.target }}/release/memorycastle-*.sha256
